[project]
name = "semanticcache"
version = "0.1.0"
description = "LangChain Semantic Cache POC with NiceGUI, Valkey, and Vertex AI"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=4.3.4",
    "langchain-google-vertexai>=2.0.0",
    "langchain-redis>=0.1.0",
    "nicegui>=2.0.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true



